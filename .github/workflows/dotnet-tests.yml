name: .NET Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar pacotes
        run: dotnet restore LojaEstoque.sln

      - name: Compilar projeto
        run: dotnet build LojaEstoque.sln --configuration Release --no-restore

      - name: Rodar testes
        run: dotnet test LojaEstoque.sln --configuration Release --no-build